# Publishes X-Sim RV as a website on GitHub Pages, behind a sign-in page: https://jerrin-v.github.io/xsim-rv/
# The repo holds the app only sealed (backup/xsim-rv.tar.gz.age). This workflow opens it with the SITE_BACKUP_KEY
# secret, builds the sign-in page with the app inside it using the backup's own tools/site-build.mjs, and publishes
# that one page. The secret is never printed; without it nothing is published.
# Runs after every push to main, and from Actions → "Publish site" → Run workflow.
# The "Update log" workflow's own README commit never starts this one (it is made with the workflow token).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the secret
        env:
          SITE_BACKUP_KEY: ${{ secrets.SITE_BACKUP_KEY }}
        run: |
          if [ -z "$SITE_BACKUP_KEY" ]; then echo "::error::The SITE_BACKUP_KEY secret is missing. Nothing was published."; exit 1; fi

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null

      - name: Open the sealed app
        shell: bash
        env:
          SITE_BACKUP_KEY: ${{ secrets.SITE_BACKUP_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SITE_BACKUP_KEY" > "$RUNNER_TEMP/backup-key.txt"
          mkdir -p "$RUNNER_TEMP/app"
          age -d -i "$RUNNER_TEMP/backup-key.txt" backup/xsim-rv.tar.gz.age | tar -xz -C "$RUNNER_TEMP/app"
          rm -f "$RUNNER_TEMP/backup-key.txt"
          cat backup/BUILD.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the sign-in page with the app inside
        run: |
          node "$RUNNER_TEMP/app/tools/site-build.mjs" "$RUNNER_TEMP/app/index.html" _site/index.html
          rm -rf "$RUNNER_TEMP/app"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
